<style>
  :root{
    --paper:#FBFBFA;
    --card:#FFFFFF;
    --line:#EAEAE6;
    --line-soft:#F1F1EE;
    --ink:#191A18;
    --ink-2:#5E625F;
    --ink-3:#9A9E9B;
    --ink-4:#C3C6C3;
    --tint:#F4F4F1;
    --radius:18px;
    --radius-sm:12px;
    --safe-top:env(safe-area-inset-top, 0px);
    --safe-bottom:env(safe-area-inset-bottom, 0px);
    --shadow:0 1px 2px rgba(20,22,20,.04), 0 6px 18px -10px rgba(20,22,20,.10);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; min-height:100%; background:var(--paper); overscroll-behavior-y:none;}
  body{
    font-family:'Assistant','Heebo',-apple-system,sans-serif;
    color:var(--ink);
    display:flex; justify-content:center;
    -webkit-font-smoothing:antialiased;
    font-feature-settings:"tnum";
  }
  .num{font-variant-numeric:tabular-nums; letter-spacing:-0.01em;}

  #app{
    width:100%; max-width:520px; min-height:100vh;
    display:flex; flex-direction:column; position:relative;
    background:var(--paper);
  }

  /* ---------- header ---------- */
  header.topbar{
    padding:calc(18px + var(--safe-top)) 22px 12px;
    display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
    position:sticky; top:0; z-index:20;
    background:rgba(251,251,250,.86);
    backdrop-filter:saturate(180%) blur(14px);
    -webkit-backdrop-filter:saturate(180%) blur(14px);
    border-bottom:1px solid transparent;
    transition:border-color .2s ease;
  }
  header.topbar.scrolled{border-bottom-color:var(--line);}
  header .eyebrow{
    font-size:11px; font-weight:700; letter-spacing:.14em; color:var(--ink-3);
    text-transform:uppercase; margin-bottom:3px;
  }
  header h1{font-size:23px; font-weight:700; margin:0; letter-spacing:-0.03em; line-height:1.15;}

  .icon-btn{
    width:36px; height:36px; border-radius:12px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:var(--card); border:1px solid var(--line); color:var(--ink-2);
    cursor:pointer; transition:transform .14s ease, background .14s ease;
    box-shadow:0 1px 2px rgba(20,22,20,.03);
  }
  .icon-btn:active{transform:scale(.93); background:var(--tint);}

  main{flex:1; padding:6px 22px calc(104px + var(--safe-bottom));}
  .view{display:none;}
  .view.active{display:block; animation:rise .3s cubic-bezier(.22,1,.36,1);}
  @keyframes rise{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}

  h2.sect{
    font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
    color:var(--ink-3); margin:26px 2px 12px;
  }

  /* ---------- today: summary ---------- */
  .summary{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:22px; margin-top:10px; box-shadow:var(--shadow);
  }
  .summary-top{display:flex; align-items:center; justify-content:space-between; gap:16px;}
  .summary .count{font-size:34px; font-weight:700; letter-spacing:-0.045em; line-height:1;}
  .summary .count span{color:var(--ink-4); font-weight:600;}
  .summary .caption{font-size:13.5px; color:var(--ink-2); margin-top:8px; line-height:1.45;}
  .ring{position:relative; width:56px; height:56px; flex-shrink:0;}
  .ring svg{transform:rotate(-90deg); display:block;}
  .ring .pct{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:700; letter-spacing:-0.02em;}

  .seg-bar{display:flex; gap:4px; margin-top:18px;}
  .seg{height:5px; flex:1; border-radius:3px; background:var(--line); transition:background .3s ease;}

  /* ---------- habit rows ---------- */
  .habit-row{
    display:flex; align-items:center; gap:14px;
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:15px 16px; margin-bottom:8px;
    transition:border-color .22s ease, background .22s ease;
  }
  .habit-row.done{border-color:color-mix(in srgb, var(--c) 34%, var(--line));}
  .habit-name{font-size:15.5px; font-weight:600; margin:0; letter-spacing:-0.015em;}
  .habit-row.done .habit-name{color:var(--ink-2);}
  .habit-meta{font-size:12.5px; color:var(--ink-3); margin-top:3px; font-weight:500;}
  .habit-info{flex:1; min-width:0;}
  .habit-name{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  .box{
    width:28px; height:28px; border-radius:9px; flex-shrink:0; cursor:pointer;
    border:1.75px solid var(--line); background:var(--card);
    display:flex; align-items:center; justify-content:center;
    transition:background .2s cubic-bezier(.22,1,.36,1), border-color .2s ease, transform .12s ease;
  }
  .box:active{transform:scale(.86);}
  .box svg{width:15px; height:15px; stroke:#fff; stroke-width:2.6; fill:none;
    stroke-linecap:round; stroke-linejoin:round;
    stroke-dasharray:22; stroke-dashoffset:22; transition:stroke-dashoffset .28s cubic-bezier(.65,0,.35,1);}
  .habit-row.done .box{background:var(--c); border-color:var(--c);}
  .habit-row.done .box svg{stroke-dashoffset:0;}

  .streak{
    font-size:12px; font-weight:600; color:var(--ink-3); flex-shrink:0;
    display:flex; align-items:center; gap:5px; letter-spacing:-0.01em;
  }
  .streak svg{width:13px; height:13px; opacity:.55;}

  /* ---------- empty ---------- */
  .empty{text-align:center; padding:64px 16px 20px;}
  .empty .mark{
    width:46px; height:46px; border-radius:14px; border:1.5px dashed var(--ink-4);
    display:flex; align-items:center; justify-content:center; margin:0 auto 18px; color:var(--ink-4);
  }
  .empty h3{font-size:17px; font-weight:700; margin:0 0 6px; letter-spacing:-0.02em;}
  .empty p{font-size:14px; color:var(--ink-2); margin:0 0 22px; line-height:1.55;}
  .btn-primary{
    background:var(--ink); color:#fff; border:none; font-family:inherit;
    font-weight:600; font-size:14.5px; padding:12px 22px; border-radius:12px;
    cursor:pointer; display:inline-flex; align-items:center; gap:7px;
    transition:transform .13s ease, opacity .15s ease;
  }
  .btn-primary:active{transform:scale(.96); opacity:.88;}

  /* ---------- month grid ---------- */
  .month-nav{display:flex; align-items:center; justify-content:space-between; margin:14px 0 14px;}
  .month-nav .label{font-size:16px; font-weight:700; letter-spacing:-0.025em;}
  .month-nav .navs{display:flex; gap:7px;}
  .grid-wrap{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    overflow:hidden; box-shadow:var(--shadow);
  }
  .grid-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  table.grid{border-collapse:collapse; width:100%;}
  table.grid th, table.grid td{padding:0; text-align:center;}
  table.grid thead th{
    padding:13px 8px 11px; border-bottom:1px solid var(--line);
    font-size:10.5px; font-weight:700; color:var(--ink-2); white-space:nowrap;
    letter-spacing:-0.01em;
  }
  table.grid th.daycol, table.grid td.daycol{
    position:sticky; right:0; background:var(--card); z-index:2;
    text-align:right; padding-right:16px; padding-left:8px; white-space:nowrap;
  }
  table.grid th.daycol{font-size:10px; letter-spacing:.1em; color:var(--ink-3); text-transform:uppercase;}
  table.grid td.daycol{font-size:12.5px; color:var(--ink-3); font-weight:600; padding-top:7px; padding-bottom:7px;}
  table.grid td.daycol .d{color:var(--ink); font-weight:600;}
  table.grid td.daycol .w{font-size:10.5px; color:var(--ink-4); margin-right:5px; font-weight:500;}
  table.grid tr.today td.daycol .d,
  table.grid tr.today td.daycol .w{color:#2E6FD9;}
  table.grid tr.today{background:#F3F7FE;}
  table.grid tr.weekend{background:#FCFCFA;}
  table.grid tr.today.weekend{background:#F3F7FE;}
  table.grid tbody tr + tr{border-top:1px solid var(--line-soft);}
  table.grid td.cell{padding:5px 7px;}
  .chip-box{
    width:24px; height:24px; border-radius:7px; margin:0 auto; cursor:pointer;
    border:1.5px solid var(--line); background:var(--card);
    display:flex; align-items:center; justify-content:center;
    transition:background .18s ease, border-color .18s ease, transform .12s ease;
  }
  .chip-box:active{transform:scale(.85);}
  .chip-box svg{width:12px; height:12px; stroke:#fff; stroke-width:3; fill:none; stroke-linecap:round; stroke-linejoin:round; opacity:0; transition:opacity .16s ease;}
  .chip-box.on{background:var(--c); border-color:var(--c);}
  .chip-box.on svg{opacity:1;}
  .chip-box.future{border-style:dashed; border-color:#EFEFEC; pointer-events:none;}
  .colhead{display:flex; flex-direction:column; align-items:center; gap:5px;}
  .colhead .dot{width:6px; height:6px; border-radius:50%; background:var(--c);}
  .grid-foot{
    display:flex; justify-content:space-between; padding:12px 16px;
    border-top:1px solid var(--line); font-size:12px; color:var(--ink-3); font-weight:500;
  }

  /* ---------- progress ---------- */
  .tabs-scroll{display:flex; gap:7px; overflow-x:auto; padding:14px 0 4px; -webkit-overflow-scrolling:touch;}
  .tabs-scroll::-webkit-scrollbar{display:none;}
  .pill{
    flex-shrink:0; padding:8px 15px; border-radius:11px; font-size:13.5px; font-weight:600;
    background:var(--card); border:1px solid var(--line); color:var(--ink-2); cursor:pointer;
    display:flex; align-items:center; gap:7px; letter-spacing:-0.015em;
    transition:all .16s ease; white-space:nowrap;
  }
  .pill .dot{width:7px; height:7px; border-radius:50%; background:var(--c);}
  .pill.active{background:var(--ink); color:#fff; border-color:var(--ink);}

  .chart-card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:22px 20px 16px; margin:16px 0 12px; box-shadow:var(--shadow);
  }
  .chart-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:2px;}
  .chart-head .big{font-size:36px; font-weight:700; letter-spacing:-0.05em; line-height:1;}
  .chart-head .delta{font-size:13px; font-weight:600;}
  .chart-sub{font-size:12.5px; color:var(--ink-3); margin-top:6px; font-weight:500;}
  .chart-note{font-size:12px; color:var(--ink-3); line-height:1.6; margin-top:12px; padding-top:12px; border-top:1px solid var(--line-soft);}

  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:var(--radius-sm); padding:15px 8px; text-align:center;}
  .stat .v{font-size:21px; font-weight:700; letter-spacing:-0.04em;}
  .stat .l{font-size:11px; color:var(--ink-3); margin-top:4px; font-weight:600;}

  /* ---------- tabbar ---------- */
  nav.tabbar{
    position:fixed; bottom:0; right:50%; transform:translateX(50%);
    width:100%; max-width:520px; z-index:30;
    padding:10px 22px calc(12px + var(--safe-bottom));
    background:linear-gradient(rgba(251,251,250,0), var(--paper) 42%);
  }
  nav.tabbar .inner{
    display:flex; background:rgba(255,255,255,.9); backdrop-filter:saturate(180%) blur(18px);
    -webkit-backdrop-filter:saturate(180%) blur(18px);
    border:1px solid var(--line); border-radius:16px; padding:5px;
    box-shadow:0 2px 6px rgba(20,22,20,.04), 0 12px 28px -14px rgba(20,22,20,.16);
  }
  nav.tabbar button{
    flex:1; background:none; border:none; color:var(--ink-3); font-family:inherit;
    padding:8px 4px; display:flex; flex-direction:column; align-items:center; gap:3px;
    font-size:10.5px; font-weight:600; border-radius:12px; cursor:pointer;
    transition:color .18s ease, background .18s ease; letter-spacing:-0.01em;
  }
  nav.tabbar button.active{color:var(--ink); background:var(--tint);}
  nav.tabbar button svg{width:19px; height:19px;}

  /* ---------- sheets ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(24,26,24,.32); z-index:50;
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .22s ease;
    backdrop-filter:blur(2px);
  }
  .overlay.open{opacity:1; pointer-events:auto;}
  .sheet{
    width:100%; max-width:520px; background:var(--card); border-radius:24px 24px 0 0;
    padding:12px 22px calc(26px + var(--safe-bottom));
    transform:translateY(100%); transition:transform .32s cubic-bezier(.22,1,.36,1);
    max-height:86vh; overflow-y:auto;
  }
  .overlay.open .sheet{transform:none;}
  .handle{width:34px; height:4px; border-radius:3px; background:var(--line); margin:0 auto 18px;}
  .sheet h3{font-size:18px; font-weight:700; margin:0 0 20px; letter-spacing:-0.03em;}
  label.fl{font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); display:block; margin-bottom:9px;}
  input[type=text]{
    width:100%; background:var(--tint); border:1px solid transparent; border-radius:12px;
    padding:13px 15px; color:var(--ink); font-size:16px; font-family:inherit; font-weight:500;
    margin-bottom:22px; transition:border-color .16s ease, background .16s ease;
  }
  input[type=text]:focus{outline:none; border-color:var(--ink-4); background:var(--card);}
  input[type=text]::placeholder{color:var(--ink-4);}
  .colors{display:flex; gap:11px; flex-wrap:wrap; margin-bottom:24px;}
  .sw{
    width:32px; height:32px; border-radius:50%; cursor:pointer; position:relative;
    transition:transform .14s ease;
  }
  .sw:active{transform:scale(.9);}
  .sw::after{
    content:''; position:absolute; inset:-4px; border-radius:50%;
    border:1.5px solid transparent; transition:border-color .16s ease;
  }
  .sw.sel::after{border-color:var(--ink);}
  .acts{display:flex; gap:9px;}
  .acts button{flex:1; padding:13px; border-radius:12px; font-weight:600; font-size:14.5px; border:none; cursor:pointer; font-family:inherit; transition:opacity .15s ease, transform .13s ease;}
  .acts button:active{transform:scale(.97);}
  .b-ghost{background:var(--tint); color:var(--ink-2);}
  .b-solid{background:var(--ink); color:#fff;}

  .mlist{margin:-4px 0 4px;}
  .mrow{display:flex; align-items:center; gap:13px; padding:13px 0;}
  .mrow + .mrow{border-top:1px solid var(--line-soft);}
  .mrow .dot{width:10px; height:10px; border-radius:50%; flex-shrink:0;}
  .mrow .nm{flex:1; font-size:15px; font-weight:600; letter-spacing:-0.015em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .mrow button{background:none; border:none; color:var(--ink-4); cursor:pointer; padding:6px; display:flex;}
  .mrow button:active{color:var(--ink-2);}
  .addrow{
    display:flex; align-items:center; gap:9px; margin-top:16px; padding:13px;
    border:1px dashed var(--line); border-radius:12px; color:var(--ink-2);
    font-weight:600; font-size:14.5px; cursor:pointer; justify-content:center;
    transition:background .15s ease;
  }
  .addrow:active{background:var(--tint);}

  #toast{
    position:fixed; bottom:calc(104px + var(--safe-bottom)); right:50%;
    transform:translateX(50%) translateY(14px);
    background:var(--ink); color:#fff; font-size:13.5px; font-weight:600;
    padding:11px 20px; border-radius:12px; z-index:60; opacity:0;
    transition:all .26s cubic-bezier(.22,1,.36,1); pointer-events:none; letter-spacing:-0.015em;
  }
  #toast.show{opacity:1; transform:translateX(50%) translateY(0);}

  #boot{position:fixed; inset:0; background:var(--paper); z-index:100; display:flex; align-items:center; justify-content:center;}
  #boot .sp{width:22px; height:22px; border-radius:50%; border:2px solid var(--line); border-top-color:var(--ink-3); animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important; transition-duration:.01ms !important;}
  }
</style>
</head>

<script>
(function(){
  "use strict";

  const COLORS = ["#3B7DD8","#2E9E7E","#D9903B","#C85F58","#7A6BC4","#2A9AA8","#C1699A","#7A9440"];
  const KEY = "habits-v2";
  const DOW = ["א","ב","ג","ד","ה","ו","ש"];
  const MON = ["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];

  let state = {habits:[], done:{}};
  let tab = "today";
  let cursor = new Date();
  let selHabit = null;
  let editing = null;
  let pendColor = COLORS[0];
  let saveT = null;

  const $ = s => document.querySelector(s);
  const pad = n => n<10 ? "0"+n : ""+n;
  const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  const today = () => iso(new Date());
  const parse = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
  const dim = (y,m) => new Date(y,m+1,0).getDate();
  const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const esc = s => { const d=document.createElement("div"); d.textContent=s; return d.innerHTML; };

  const TICK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.6 4.6L19 7.4"/></svg>';

  function toast(m){
    const t = $("#toast"); t.textContent = m; t.classList.add("show");
    clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove("show"), 1700);
  }

  // ---- storage ----
  async function load(){
    try{
      const r = await window.storage.get(KEY, false);
      if(r && r.value){ const p = JSON.parse(r.value); state.habits = p.habits||[]; state.done = p.done||{}; }
    }catch(e){
      try{
        const old = await window.storage.get("ht-data", false);
        if(old && old.value){ const p = JSON.parse(old.value); state.habits = p.habits||[]; state.done = p.completions||{}; }
      }catch(e2){}
    }
  }
  function save(){
    clearTimeout(saveT);
    saveT = setTimeout(async ()=>{
      try{ await window.storage.set(KEY, JSON.stringify(state), false); }
      catch(e){ toast("השמירה נכשלה"); }
    }, 160);
  }

  // ---- data ----
  const isOn = (h,d) => !!(state.done[d] && state.done[d][h]);
  function toggle(h,d){
    if(!state.done[d]) state.done[d] = {};
    if(state.done[d][h]) delete state.done[d][h]; else state.done[d][h] = 1;
    save();
  }
  const col = h => h.color || COLORS[0];

  function daysSince(h){
    const s = parse(h.createdAt), e = new Date();
    s.setHours(0,0,0,0); e.setHours(0,0,0,0);
    const out = []; let c = new Date(s);
    while(c <= e){ out.push(iso(c)); c.setDate(c.getDate()+1); }
    return out;
  }
  function series(h){
    let v = 1; const out = [];
    for(const d of daysSince(h)){ v *= isOn(h.id,d) ? 1.01 : 0.99; out.push(v); }
    return out;
  }
  function streak(h){
    let n = 0, c = new Date(); c.setHours(0,0,0,0);
    if(!isOn(h.id, iso(c))) c.setDate(c.getDate()-1); // today not yet marked doesn't break streak
    while(iso(c) >= h.createdAt && isOn(h.id, iso(c))){ n++; c.setDate(c.getDate()-1); }
    return n;
  }
  function best(h){
    let b=0,c=0;
    for(const d of daysSince(h)){ if(isOn(h.id,d)){c++; if(c>b)b=c;} else c=0; }
    return b;
  }
  function rate(h){
    const ds = daysSince(h);
    const n = ds.filter(d=>isOn(h.id,d)).length;
    return ds.length ? Math.round(n/ds.length*100) : 0;
  }
  function heDate(d){ return d.getDate()+" ב"+MON[d.getMonth()]; }

  // ---- header ----
  function setHeader(){
    const n = new Date();
    const titles = {today:"היום", month:"טבלה חודשית", progress:"התקדמות"};
    $("#hd-eyebrow").textContent = tab==="today"
      ? n.toLocaleDateString("he-IL",{weekday:"long"}) + " · " + heDate(n)
      : "מעקב הרגלים";
    $("#hd-title").textContent = titles[tab];
  }

  // ---- empty ----
  function emptyHTML(t,s){
    return `<div class="empty">
      <div class="mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></div>
      <h3>${t}</h3><p>${s}</p>
      <button class="btn-primary" id="e-add">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        הוספת הרגל
      </button></div>`;
  }
  function bindEmpty(el){ const b = el.querySelector("#e-add"); if(b) b.onclick = ()=>openHabit(); }

  // ---- TODAY ----
  function renderToday(){
    const el = $("#v-today"), d = today();
    if(!state.habits.length){ el.innerHTML = emptyHTML("בואו נתחיל","הוסיפו את ההרגל הראשון והתחילו לצבור ימים."); bindEmpty(el); return; }

    const act = state.habits.filter(h=>h.createdAt <= d);
    const n = act.filter(h=>isOn(h.id,d)).length;
    const p = act.length ? n/act.length : 0;
    const r = 24, C = 2*Math.PI*r;
    const cap = !act.length ? "" : p===1 ? "השלמתם את כל ההרגלים היום." : n===0 ? "עוד לא סימנתם כלום היום." : "עוד "+(act.length-n)+" להשלמת היום.";

    let h = `<div class="summary">
      <div class="summary-top">
        <div>
          <div class="count num">${n}<span> / ${act.length}</span></div>
          <div class="caption">${cap}</div>
        </div>
        <div class="ring">
          <svg width="56" height="56" viewBox="0 0 56 56">
            <circle cx="28" cy="28" r="${r}" stroke="#EDEDEA" stroke-width="4.5" fill="none"/>
            <circle cx="28" cy="28" r="${r}" stroke="#191A18" stroke-width="4.5" fill="none" stroke-linecap="round"
              stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C-C*p).toFixed(1)}"
              style="transition:stroke-dashoffset .5s cubic-bezier(.22,1,.36,1)"/>
          </svg>
          <div class="pct num">${Math.round(p*100)}%</div>
        </div>
      </div>
      <div class="seg-bar">${act.map(x=>`<div class="seg" style="${isOn(x.id,d)?'background:'+col(x):''}"></div>`).join("")}</div>
    </div>
    <h2 class="sect">הרגלים</h2>`;

    for(const x of act){
      const on = isOn(x.id,d), s = streak(x);
      h += `<div class="habit-row ${on?'done':''}" style="--c:${col(x)}">
        <div class="box" data-t="${x.id}">${TICK}</div>
        <div class="habit-info">
          <p class="habit-name">${esc(x.name)}</p>
          <div class="habit-meta">${s>0 ? s+" ימים ברצף" : "התחילו רצף חדש"}</div>
        </div>
        ${s>1 ? `<div class="streak num"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L5 14h6l-1 8 8-12h-6z"/></svg>${s}</div>` : ``}
      </div>`;
    }
    el.innerHTML = h;
    el.querySelectorAll("[data-t]").forEach(b=>{
      b.onclick = ()=>{ toggle(b.dataset.t, d); renderToday(); };
    });
  }

  // ---- MONTH ----
  function renderMonth(){
    const el = $("#v-month");
    if(!state.habits.length){ el.innerHTML = emptyHTML("אין עדיין נתונים","כאן תראו טבלה חודשית של כל ההרגלים."); bindEmpty(el); return; }

    const y = cursor.getFullYear(), m = cursor.getMonth(), N = dim(y,m), td = today();
    const now = new Date();
    const isCurMonth = y===now.getFullYear() && m===now.getMonth();

    let filled = 0, possible = 0;
    let rows = "";
    for(let i=1;i<=N;i++){
      const dt = new Date(y,m,i), ds = iso(dt);
      const wk = dt.getDay()===5 || dt.getDay()===6;
      let cells = "";
      for(const h of state.habits){
        if(ds < h.createdAt){ cells += `<td class="cell"></td>`; continue; }
        const fut = ds > td, on = isOn(h.id,ds);
        if(!fut){ possible++; if(on) filled++; }
        cells += `<td class="cell"><div class="chip-box ${on?'on':''} ${fut?'future':''}" style="--c:${col(h)}" data-d="${ds}" data-h="${h.id}">${TICK}</div></td>`;
      }
      rows += `<tr class="${ds===td?'today':''} ${wk?'weekend':''}">
        <td class="daycol"><span class="w">${DOW[dt.getDay()]}</span><span class="d num">${i}</span></td>${cells}</tr>`;
    }

    el.innerHTML = `
      <div class="month-nav">
        <div class="navs">
          <button class="icon-btn" id="m-prev"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
          <button class="icon-btn" id="m-next"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
        </div>
        <div class="label">${MON[m]} ${y}</div>
      </div>
      <div class="grid-wrap">
        <div class="grid-scroll"><table class="grid">
          <thead><tr><th class="daycol">יום</th>
            ${state.habits.map(h=>`<th><div class="colhead" style="--c:${col(h)}"><span class="dot"></span>${esc(h.name.length>7?h.name.slice(0,7)+"…":h.name)}</div></th>`).join("")}
          </tr></thead>
          <tbody>${rows}</tbody>
        </table></div>
        <div class="grid-foot">
          <span>${isCurMonth ? "עד היום" : "החודש כולו"}</span>
          <span class="num">${possible? Math.round(filled/possible*100):0}% ביצוע · ${filled}/${possible}</span>
        </div>
      </div>`;

    $("#m-prev").onclick = ()=>{ cursor = new Date(y,m-1,1); renderMonth(); };
    $("#m-next").onclick = ()=>{ cursor = new Date(y,m+1,1); renderMonth(); };
    el.querySelectorAll("[data-d]").forEach(b=>{
      b.onclick = ()=>{ toggle(b.dataset.h, b.dataset.d); renderMonth(); };
    });
  }

  // ---- PROGRESS ----
  function renderProgress(){
    const el = $("#v-progress");
    if(!state.habits.length){ el.innerHTML = emptyHTML("אין עדיין התקדמות","1% ביום מצטבר לשינוי משמעותי. נתחיל?"); bindEmpty(el); return; }
    if(!selHabit || !state.habits.find(h=>h.id===selHabit)) selHabit = state.habits[0].id;

    const h = state.habits.find(x=>x.id===selHabit);
    const s = series(h);
    const cur = s.length ? s[s.length-1] : 1;
    const delta = Math.round((cur-1)*100);
    const c = col(h);

    el.innerHTML = `
      <div class="tabs-scroll">
        ${state.habits.map(x=>`<div class="pill ${x.id===selHabit?'active':''}" style="--c:${col(x)}" data-p="${x.id}"><span class="dot"></span>${esc(x.name)}</div>`).join("")}
      </div>
      <div class="chart-card">
        <div class="chart-head">
          <div class="big num">${cur.toFixed(2)}<span style="font-size:20px; color:var(--ink-4); font-weight:600;">×</span></div>
          <div class="delta num" style="color:${delta>=0?'#2E9E7E':'#C85F58'}">${delta>=0?'+':''}${delta}%</div>
        </div>
        <div class="chart-sub">${s.length} ימים מאז ${heDate(parse(h.createdAt))}</div>
        ${chart(s,c)}
        <div class="chart-note">כל יום שבוצע מכפיל ב־1.01, כל יום שהוחמץ מכפיל ב־0.99. זו ההשפעה המצטברת של ההתמדה לאורך זמן.</div>
      </div>
      <div class="stats">
        <div class="stat"><div class="v num">${streak(h)}</div><div class="l">רצף נוכחי</div></div>
        <div class="stat"><div class="v num">${best(h)}</div><div class="l">שיא רצף</div></div>
        <div class="stat"><div class="v num">${rate(h)}%</div><div class="l">אחוז ביצוע</div></div>
      </div>`;

    el.querySelectorAll("[data-p]").forEach(b=>{
      b.onclick = ()=>{ selHabit = b.dataset.p; renderProgress(); };
    });
  }

  function chart(vals, c){
    const W=440, H=132, P=6;
    if(vals.length < 2){
      return `<div style="height:132px; display:flex; align-items:center; justify-content:center; color:var(--ink-4); font-size:12.5px; font-weight:500;">הגרף ייבנה החל מהיום השני</div>`;
    }
    const mn = Math.min(...vals), mx = Math.max(...vals), rg = (mx-mn) || 1;
    const sx = (W-P*2)/(vals.length-1);
    const pts = vals.map((v,i)=>[P+i*sx, P+(H-P*2)*(1-(v-mn)/rg)]);
    const line = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
    const area = line+` L${pts[pts.length-1][0].toFixed(1)},${H} L${P},${H} Z`;
    const gid = "g"+c.slice(1);
    const last = pts[pts.length-1];
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%; height:132px; display:block; margin-top:14px; overflow:visible;">
      <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${c}" stop-opacity=".18"/>
        <stop offset="100%" stop-color="${c}" stop-opacity="0"/>
      </linearGradient></defs>
      <path d="${area}" fill="url(#${gid})"/>
      <path d="${line}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
      <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3.2" fill="${c}" stroke="#fff" stroke-width="2"/>
    </svg>`;
  }

  // ---- tabs ----
  function go(t){
    tab = t;
    document.querySelectorAll(".tb").forEach(b=>b.classList.toggle("active", b.dataset.tab===t));
    ["today","month","progress"].forEach(k=>$("#v-"+k).classList.toggle("active", k===t));
    setHeader();
    if(t==="today") renderToday();
    if(t==="month") renderMonth();
    if(t==="progress") renderProgress();
    window.scrollTo({top:0});
  }

  // ---- habit sheet ----
  function buildColors(){
    const g = $("#colors");
    g.innerHTML = COLORS.map(c=>`<div class="sw ${c===pendColor?'sel':''}" data-c="${c}" style="background:${c}"></div>`).join("");
    g.querySelectorAll(".sw").forEach(s=>{
      s.onclick = ()=>{ pendColor = s.dataset.c; g.querySelectorAll(".sw").forEach(x=>x.classList.remove("sel")); s.classList.add("sel"); };
    });
  }
  function openHabit(id){
    editing = id || null;
    const h = id ? state.habits.find(x=>x.id===id) : null;
    $("#sh-title").textContent = h ? "עריכת הרגל" : "הרגל חדש";
    $("#in-name").value = h ? h.name : "";
    pendColor = h ? col(h) : COLORS[state.habits.length % COLORS.length];
    buildColors();
    $("#sheet-habit").classList.add("open");
    setTimeout(()=>$("#in-name").focus(), 300);
  }
  function saveHabit(){
    const n = $("#in-name").value.trim();
    if(!n){ toast("נא להזין שם"); return; }
    if(editing){ const h = state.habits.find(x=>x.id===editing); h.name = n; h.color = pendColor; }
    else state.habits.push({id:uid(), name:n, color:pendColor, createdAt:today()});
    save();
    $("#sheet-habit").classList.remove("open");
    go(tab);
    toast(editing ? "עודכן" : "נוסף בהצלחה");
  }

  function renderManage(){
    const l = $("#mlist");
    if(!state.habits.length){ l.innerHTML = `<div style="color:var(--ink-3); font-size:14px; padding:6px 0 2px;">עדיין לא הוגדרו הרגלים.</div>`; return; }
    l.innerHTML = state.habits.map(h=>`<div class="mrow">
      <span class="dot" style="background:${col(h)}"></span>
      <span class="nm">${esc(h.name)}</span>
      <button data-e="${h.id}" aria-label="עריכה"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
      <button data-x="${h.id}" aria-label="מחיקה"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 6h17M9 6V4.2A1.7 1.7 0 0 1 10.7 2.5h2.6A1.7 1.7 0 0 1 15 4.2V6m3.5 0-.9 14a2 2 0 0 1-2 1.9H7.4a2 2 0 0 1-2-1.9L4.5 6"/></svg></button>
    </div>`).join("");
    l.querySelectorAll("[data-e]").forEach(b=>b.onclick = ()=>{ $("#sheet-manage").classList.remove("open"); openHabit(b.dataset.e); });
    l.querySelectorAll("[data-x]").forEach(b=>b.onclick = ()=>{
      const h = state.habits.find(x=>x.id===b.dataset.x);
      if(confirm(`למחוק את "${h.name}"? כל ההיסטוריה תימחק.`)){
        state.habits = state.habits.filter(x=>x.id!==h.id);
        Object.keys(state.done).forEach(d=>delete state.done[d][h.id]);
        save(); renderManage(); go(tab);
      }
    });
  }

  function bind(){
    document.querySelectorAll(".tb").forEach(b=>b.onclick = ()=>go(b.dataset.tab));
    $("#btn-manage").onclick = ()=>{ renderManage(); $("#sheet-manage").classList.add("open"); };
    $("#mg-close").onclick = ()=>$("#sheet-manage").classList.remove("open");
    $("#add-from-manage").onclick = ()=>{ $("#sheet-manage").classList.remove("open"); openHabit(); };
    $("#sh-cancel").onclick = ()=>$("#sheet-habit").classList.remove("open");
    $("#sh-save").onclick = saveHabit;
    $("#in-name").onkeydown = e => { if(e.key==="Enter") saveHabit(); };
    ["sheet-habit","sheet-manage"].forEach(id=>{
      $("#"+id).addEventListener("click", e=>{ if(e.target.id===id) $("#"+id).classList.remove("open"); });
    });
    window.addEventListener("scroll", ()=>{
      $("#topbar").classList.toggle("scrolled", window.scrollY > 4);
    }, {passive:true});
  }

  (async function init(){
    await load(); bind(); setHeader();
    $("#boot").style.display = "none";
    $("#app").style.display = "flex";
    renderToday();
  })();
})();
</script>
</body>
</html>
